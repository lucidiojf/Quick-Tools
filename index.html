<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Quick Tools</title>
  
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    :root {
      --bg: var(--tg-theme-bg-color, #ffffff);
      --text: var(--tg-theme-text-color, #111111);
      --sec-bg: var(--tg-theme-secondary-bg-color, #f3f4f6);
      --btn-bg: var(--tg-theme-button-color, #2481cc);
      --btn-text: var(--tg-theme-button-text-color, #ffffff);
      --hint: var(--tg-theme-hint-color, #707579);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 16px;
    }
    h1 { font-size: 20px; text-align: center; margin: 0 0 4px 0; }
    p.welcome { text-align: center; margin: 0 0 16px 0; font-size: 13px; color: var(--hint); }

    .tabs-wrapper {
      display: flex;
      overflow-x: auto;
      white-space: nowrap;
      margin-bottom: 16px;
      border-bottom: 2px solid var(--sec-bg);
      -webkit-overflow-scrolling: touch;
    }
    .tabs-wrapper::-webkit-scrollbar { display: none; }
    .tab-btn {
      background: none;
      border: none;
      padding: 10px 14px;
      color: var(--text);
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      opacity: 0.6;
      border-bottom: 3px solid transparent;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }
    .tab-btn.active {
      opacity: 1;
      border-bottom: 3px solid var(--btn-bg);
      color: var(--btn-bg);
    }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .card {
      background: var(--sec-bg);
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.04);
      margin-bottom: 14px;
    }
    label { font-weight: 600; font-size: 13px; display: block; margin-bottom: 6px; }
    input[type="text"], input[type="tel"], input[type="url"], input[type="file"], select, textarea {
      width: 100%;
      padding: 11px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 14px;
      margin-bottom: 12px;
      background: #ffffff;
      color: #000000;
    }
    textarea { min-height: 80px; resize: vertical; }

    button.action-btn {
      background-color: var(--btn-bg);
      color: var(--btn-text);
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      width: 100%;
      text-align: center;
    }
    button.action-btn:active { opacity: 0.85; }

    .grid-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .grid-buttons button {
      background: var(--btn-bg);
      color: var(--btn-text);
      border: none;
      padding: 11px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
    }

    .result-box {
      background: rgba(0, 0, 0, 0.04);
      border: 1px dashed #bbb;
      padding: 12px;
      border-radius: 8px;
      margin-top: 14px;
      word-break: break-all;
      text-align: center;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <h1>🛠️ Quick Tools</h1>
  <p class="welcome" id="boasVindas">Bem-vindo!</p>

  <div class="tabs-wrapper">
    <button type="button" class="tab-btn active" data-target="tab-whats">💬 WhatsApp</button>
    <button type="button" class="tab-btn" data-target="tab-busca">🔍 Buscas</button>
    <button type="button" class="tab-btn" data-target="tab-links">🔗 Links</button>
    <button type="button" class="tab-btn" data-target="tab-qr">🔳 QR Code</button>
    <button type="button" class="tab-btn" data-target="tab-transcribe">🎙️ Voz p/ Texto</button>
    <button type="button" class="tab-btn" data-target="tab-translate">🌐 Tradutor</button>
    <button type="button" class="tab-btn" data-target="tab-calc">🔢 Calculadora</button>
    <button type="button" class="tab-btn" data-target="tab-media">🎬 Vídeos</button>
  </div>

  <!-- 1. WHATSAPP -->
  <div id="tab-whats" class="tab-content active">
    <div class="card">
      <label for="numWhats">Número com DDD (Brasil +55):</label>
      <input type="tel" id="numWhats" placeholder="Ex: 11999999999">
      <button type="button" class="action-btn" id="btnWhats">💬 Abrir Conversa Direta</button>
    </div>
  </div>

  <!-- 2. BUSCAS E COMPARADORES -->
  <div id="tab-busca" class="tab-content">
    <div class="card">
      <label for="termoBusca">Digite o termo ou produto:</label>
      <input type="text" id="termoBusca" placeholder="Ex: fone sem fio">
      <div class="grid-buttons">
        <button type="button" class="btn-busca" data-dest="google">🌐 Google</button>
        <button type="button" class="btn-busca" data-dest="ml">🟡 Mercado Livre</button>
        <button type="button" class="btn-busca" data-dest="amazon">📦 Amazon</button>
        <button type="button" class="btn-busca" data-dest="shein">👗 Shein</button>
        <button type="button" class="btn-busca" data-dest="magalu">💙 Magalu</button>
        <button type="button" class="btn-busca" data-dest="ali">🔴 AliExpress</button>
        <button type="button" class="btn-busca" data-dest="bahia">🔵 Casas Bahia</button>
        <button type="button" class="btn-busca" data-dest="americanas">🔴 Americanas</button>
        <button type="button" class="btn-busca" data-dest="buscape">🏷️ Buscapé</button>
        <button type="button" class="btn-busca" data-dest="zoom">🔎 Zoom</button>
        <button type="button" class="btn-busca" data-dest="bondfaro">🎯 Bondfaro</button>
      </div>
    </div>
  </div>

  <!-- 3. ENCURTADOR DE LINKS -->
  <div id="tab-links" class="tab-content">
    <div class="card">
      <label for="linkOriginal">Cole a URL longa:</label>
      <input type="url" id="linkOriginal" placeholder="https://exemplo.com/pagina-longa">
      <button type="button" class="action-btn" id="btnEncurtar">⚡ Encurtar Link</button>
      <div id="boxLinkResult" class="result-box" style="display: none;">
        <span id="linkEncurtado"></span>
        <button type="button" class="action-btn" id="btnCopiarLink" style="margin-top: 10px; padding: 8px; background: #28a745;">📋 Copiar</button>
      </div>
    </div>
  </div>

  <!-- 4. QR CODE -->
  <div id="tab-qr" class="tab-content">
    <div class="card">
      <label for="textoQr">🎨 Criar QR Code:</label>
      <input type="text" id="textoQr" placeholder="Digite link, texto ou Pix...">
      <button type="button" class="action-btn" id="btnGerarQr">🔳 Gerar QR Code</button>
      <div id="boxQrResult" style="display: none; text-align: center; margin-top: 14px;">
        <img id="imgQr" src="" alt="QR Code" style="border: 4px solid white; border-radius: 8px; max-width: 180px;">
      </div>
    </div>

    <div class="card">
      <label for="qrFotoInput">🖼️ Ler QR Code da Galeria / Imagem:</label>
      <p style="font-size: 12px; color: var(--hint); margin: 0 0 10px 0;">Escolha uma imagem ou foto com QR Code:</p>
      <input type="file" id="qrFotoInput" accept="image/*">
      <button type="button" class="action-btn" id="btnLerQrFoto" style="background: #28a745;">🔍 Ler QR Code da Imagem</button>

      <div id="boxQrLido" class="result-box" style="display: none;">
        <strong>Conteúdo Identificado:</strong>
        <p id="textoQrLido" style="margin: 8px 0; font-size: 13px; font-weight: bold;"></p>
        <div style="display: flex; gap: 8px; margin-top: 10px;">
          <button type="button" class="action-btn" id="btnCopiarQrLido" style="padding: 8px; font-size: 13px;">📋 Copiar</button>
          <button type="button" class="action-btn" id="btnAbrirLinkQr" style="padding: 8px; font-size: 13px; display: none; background: #007bff;">🔗 Abrir Link</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 5. VOZ PARA TEXTO -->
  <div id="tab-transcribe" class="tab-content">
    <div class="card">
      <label>Reconhecimento de Fala:</label>
      <button type="button" id="btnGravarVoz" class="action-btn">🎙️ Iniciar Escuta</button>
      <p id="statusGravador" style="font-size: 12px; color: var(--hint); margin: 6px 0 10px 0; text-align: center;">Clique para falar via microfone.</p>
      
      <label for="textoTranscricao">Texto Transcrito:</label>
      <textarea id="textoTranscricao" placeholder="O que falar aparecerá aqui..."></textarea>
      <button type="button" class="action-btn" id="btnCopiarTranscricao" style="padding: 10px; font-size: 13px; background: #28a745;">📋 Copiar Texto</button>
    </div>
  </div>

  <!-- 6. TRADUTOR -->
  <div id="tab-translate" class="tab-content">
    <div class="card">
      <label for="textoTraduzir">Texto para traduzir:</label>
      <textarea id="textoTraduzir" placeholder="Digite o texto em qualquer idioma..."></textarea>
      <div style="display: flex; gap: 8px; margin-bottom: 12px;">
        <select id="langTarget" style="margin: 0;">
          <option value="pt">Português</option>
          <option
