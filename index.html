<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Quick Tools</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: var(--tg-theme-bg-color, #ffffff);
      --text: var(--tg-theme-text-color, #111111);
      --sec-bg: var(--tg-theme-secondary-bg-color, #f3f4f6);
      --btn-bg: var(--tg-theme-button-color, #2481cc);
      --btn-text: var(--tg-theme-button-text-color, #ffffff);
      --hint: var(--tg-theme-hint-color, #707579);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 16px;
    }
    h1 { font-size: 20px; text-align: center; margin: 0 0 4px 0; }
    p.welcome { text-align: center; margin: 0 0 16px 0; font-size: 13px; color: var(--hint); }
    .tabs-wrapper {
      display: flex;
      overflow-x: auto;
      white-space: nowrap;
      margin-bottom: 16px;
      border-bottom: 2px solid var(--sec-bg);
      -webkit-overflow-scrolling: touch;
    }
    .tabs-wrapper::-webkit-scrollbar { display: none; }
    .tab-btn {
      background: none;
      border: none;
      padding: 10px 14px;
      color: var(--text);
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      opacity: 0.6;
      border-bottom: 3px solid transparent;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }
    .tab-btn.active {
      opacity: 1;
      border-bottom: 3px solid var(--btn-bg);
      color: var(--btn-bg);
    }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .card {
      background: var(--sec-bg);
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.04);
      margin-bottom: 14px;
    }
    label { font-weight: 600; font-size: 13px; display: block; margin-bottom: 6px; }
    input[type="text"], input[type="tel"], input[type="url"], input[type="file"], select, textarea {
      width: 100%;
      padding: 11px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 14px;
      margin-bottom: 12px;
      background: #ffffff;
      color: #000000;
    }
    button.action-btn {
      background-color: var(--btn-bg);
      color: var(--btn-text);
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      width: 100%;
      text-align: center;
    }
    .grid-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .grid-buttons button {
      background: var(--btn-bg);
      color: var(--btn-text);
      border: none;
      padding: 11px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
    }
    .result-box {
      background: rgba(0, 0, 0, 0.04);
      border: 1px dashed #bbb;
      padding: 12px;
      border-radius: 8px;
      margin-top: 14px;
      word-break: break-all;
      text-align: center;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <h1>🛠️ Quick Tools</h1>
  <p class="welcome" id="boasVindas">Bem-vindo!</p>

  <div class="tabs-wrapper">
    <button type="button" class="tab-btn" data-target="tab-whats">💬 WhatsApp</button>
    <button type="button" class="tab-btn" data-target="tab-busca">🔍 Buscas</button>
    <button type="button" class="tab-btn" data-target="tab-links">🔗 Links</button>
    <button type="button" class="tab-btn" data-target="tab-qr">🔳 QR Code</button>
    <button type="button" class="tab-btn" data-target="tab-transcribe">🎙️ Voz</button>
    <button type="button" class="tab-btn active" data-target="tab-media">🎵 Músicas & Vídeos</button>
  </div>

  <!-- ABA MÍDIA -->
  <div id="tab-media" class="tab-content active">
    <div class="card">
      <label for="linkMidia">📥 Baixar Vídeo ou Áudio por Link:</label>
      <input type="url" id="linkMidia" placeholder="Cole o link do Instagram, YouTube, TikTok...">
      <div class="grid-buttons">
        <button type="button" class="btn-down-link" data-servico="cobalt" style="background: #28a745;">⚡ Baixar Tudo (Cobalt)</button>
        <button type="button" class="btn-down-link" data-servico="y2mate" style="background: #d9534f;">▶️ YouTube MP4 / MP3</button>
        <button type="button" class="btn-down-link" data-servico="snapsave" style="background: #2481cc;">📸 Instagram / Reels</button>
        <button type="button" class="btn-down-link" data-servico="savethevideo" style="background: #555;">🌐 SaveTheVideo</button>
      </div>
      <div id="statusDownload" class="result-box" style="display: none; font-size: 12px;"></div>
    </div>

    <div class="card">
      <label>🌐 Portais Diretos:</label>
      <div class="grid-buttons">
        <button type="button" class="btn-link-ext" data-url="https://cobalt.tools">⚡ Cobalt Tools</button>
        <button type="button" class="btn-link-ext" data-url="https://snapsave.app/pt">📲 SnapSave</button>
      </div>
    </div>
  </div>

  <script>
    (function() {
      var tg = null;
      try {
        if (window.Telegram && window.Telegram.WebApp) {
          tg = window.Telegram.WebApp;
          tg.ready();
          tg.expand();
        }
      } catch(e) {}

      function haptic() {
        try {
          if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
        } catch(e) {}
      }

      function abrirLinkUniversal(url) {
        haptic();
        try {
          if (tg && typeof tg.openLink === 'function') {
            tg.openLink(url, { try_instant_view: false });
            return;
          }
        } catch(e) {}
        window.open(url, '_blank');
      }

      // NAVEGAÇÃO DE ABAS
      var tabBtns = document.querySelectorAll('.tab-btn');
      var tabContents = document.querySelectorAll('.tab-content');
      tabBtns.forEach(function(btn) {
        btn.addEventListener('click', function() {
          var targetId = this.getAttribute('data-target');
          tabBtns.forEach(function(b) { b.classList.remove('active'); });
          tabContents.forEach(function(c) { c.classList.remove('active'); });
          this.classList.add('active');
          var targetEl = document.getElementById(targetId);
          if (targetEl) targetEl.classList.add('active');
        });
      });

      // AÇÃO DOS BOTÕES DE VÍDEO
      var botoesDownload = document.querySelectorAll('.btn-down-link');
      botoesDownload.forEach(function(btn) {
        btn.addEventListener('click', function(e) {
          e.preventDefault();
          var inputMidia = document.getElementById('linkMidia');
          var rawLink = inputMidia ? inputMidia.value.trim() : '';
          
          if (!rawLink) {
            alert('Por favor, cole primeiro o link do vídeo.');
            return;
          }

          var status = document.getElementById('statusDownload');
          var servico = this.getAttribute('data-servico');
          var enc = encodeURIComponent(rawLink);

          // Copia preventivamente para a área de transferência caso o site de destino precise de colar
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(rawLink);
          }

          if (status) {
            status.style.display = 'block';
            status.innerText = 'Link copiado! A redirecionar para o serviço...';
          }

          var destino = '';
          if (servico === 'cobalt') {
            destino = 'https://cobalt.tools';
          } else if (servico === 'snapsave') {
            destino = 'https://snapsave.app/pt';
          } else if (servico === 'y2mate') {
            destino = 'https://www.y2mate.com/pt/search/' + enc;
          } else if (servico === 'savethevideo') {
            destino = 'https://www.savethevideo.com/pt/downloader';
          }

          setTimeout(function() {
            abrirLinkUniversal(destino);
          }, 300);
        });
      });

      // Links Gerais
      var linksExt = document.querySelectorAll('.btn-link-ext');
      linksExt.forEach(function(link) {
        link.addEventListener('click', function() {
          abrirLinkUniversal(this.getAttribute('data-url'));
        });
      });
    })();
  </script>
</body>
</html>
