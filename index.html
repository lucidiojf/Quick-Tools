<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Quick Tools</title>
  <!-- Telegram Web App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Leitor de QR Code -->
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <!-- Calculadora matemática -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/12.4.1/math.js"></script>
  <!-- Manipulador de ZIP -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    :root {
      --bg: var(--tg-theme-bg-color, #ffffff);
      --text: var(--tg-theme-text-color, #111111);
      --sec-bg: var(--tg-theme-secondary-bg-color, #f3f4f6);
      --btn-bg: var(--tg-theme-button-color, #2481cc);
      --btn-text: var(--tg-theme-button-text-color, #ffffff);
    }
    * {
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 16px;
    }
    h1 {
      font-size: 20px;
      text-align: center;
      margin: 0 0 4px 0;
    }
    p.welcome {
      text-align: center;
      margin: 0 0 16px 0;
      font-size: 13px;
      opacity: 0.75;
    }
    /* Barra de rolagem horizontal das Abas */
    .tabs-wrapper {
      overflow-x: auto;
      white-space: nowrap;
      margin-bottom: 16px;
      border-bottom: 2px solid var(--sec-bg);
      -webkit-overflow-scrolling: touch;
    }
    .tabs-wrapper::-webkit-scrollbar {
      display: none;
    }
    .tab-btn {
      background: none;
      border: none;
      display: inline-block;
      padding: 10px 14px;
      color: var(--text);
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      opacity: 0.6;
      border-bottom: 3px solid transparent;
      transition: all 0.2s ease;
    }
    .tab-btn.active {
      opacity: 1;
      border-bottom: 3px solid var(--btn-bg);
    }
    .tab-content {
      display: none;
    }
    .tab-content.active {
      display: block;
    }
    .card {
      background: var(--sec-bg);
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.04);
    }
    label {
      font-weight: 600;
      font-size: 13px;
      display: block;
      margin-bottom: 6px;
    }
    input[type="text"], input[type="tel"], input[type="url"], input[type="file"] {
      width: 100%;
      padding: 11px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 15px;
      margin-bottom: 12px;
      background: #ffffff;
      color: #000000;
    }
    button.action-btn {
      background-color: var(--btn-bg);
      color: var(--btn-text);
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      width: 100%;
      text-align: center;
    }
    button.action-btn:active {
      opacity: 0.85;
    }
    .grid-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .grid-buttons button {
      background: var(--btn-bg);
      color: var(--btn-text);
      border: none;
      padding: 11px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
    }
    .result-box {
      background: rgba(0, 0, 0, 0.04);
      border: 1px dashed #bbb;
      padding: 12px;
      border-radius: 8px;
      margin-top: 14px;
      word-break: break-all;
      text-align: center;
      font-size: 14px;
    }
    .sub-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }
    .sub-tabs button {
      flex: 1;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid var(--btn-bg);
      background: var(--btn-bg);
      color: var(--btn-text);
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
    }
    .sub-tabs button.inactive {
      background: transparent;
      color: var(--btn-bg);
    }
    #reader {
      width: 100%;
      background: #000000;
      border-radius: 8px;
      overflow: hidden;
    }
    ul.file-list {
      text-align: left;
      margin: 8px 0 0 0;
      padding-left: 20px;
      font-size: 13px;
    }
  </style>
</head>
<body>

  <h1>🛠️ Quick Tools</h1>
  <p class="welcome" id="boasVindas">Bem-vindo!</p>

  <!-- Abas de Navegação -->
  <div class="tabs-wrapper">
    <button class="tab-btn active" onclick="switchTab('tab-whats', this)">💬 WhatsApp</button>
    <button class="tab-btn" onclick="switchTab('tab-busca', this)">🔍 Buscas</button>
    <button class="tab-btn" onclick="switchTab('tab-links', this)">🔗 Links</button>
    <button class="tab-btn" onclick="switchTab('tab-qr', this)">🔳 QR Code</button>
    <button class="tab-btn" onclick="switchTab('tab-calc', this)">🔢 Calculadora</button>
    <button class="tab-btn" onclick="switchTab('tab-zip', this)">📦 Zip / Unzip</button>
  </div>

  <!-- 1. WHATSAPP DIRETO -->
  <div id="tab-whats" class="tab-content active">
    <div class="card">
      <label for="numWhats">Número de celular com DDD:</label>
      <input type="tel" id="numWhats" placeholder="Ex: 11999999999" oninput="formatarNum(this)">
      <button class="action-btn" onclick="gerarWhats()">💬 Abrir Conversa Direta</button>
    </div>
  </div>

  <!-- 2. BUSCAS GERAIS E LOJAS -->
  <div id="tab-busca" class="tab-content">
    <div class="card">
      <label for="termoBusca">Digite o termo ou produto procurado:</label>
      <input type="text" id="termoBusca" placeholder="Ex: fone bluetooth sem fio">
      <div class="grid-buttons">
        <button onclick="buscar('google')">🌐 Google</button>
        <button onclick="buscar('ml')">🟡 Mercado Livre</button>
        <button onclick="buscar('amazon')">📦 Amazon</button>
        <button onclick="buscar('shein')">👗 Shein</button>
      </div>
    </div>
  </div>

  <!-- 3. ENCURTAR LINK -->
  <div id="tab-links" class="tab-content">
    <div class="card">
      <label for="linkOriginal">Cole a URL longa que deseja encurtar:</label>
      <input type="url" id="linkOriginal" placeholder="https://exemplo.com/pagina-muito-longa">
      <button class="action-btn" onclick="encurtarLink()">⚡ Encurtar Link</button>
      
      <div id="boxLinkResult" class="result-box" style="display: none;">
        <span id="linkEncurtado"></span>
        <button class="action-btn" onclick="copiarLink()" style="margin-top: 10px; padding: 8px; font-size: 13px; background: #28a745;">📋 Copiar Link</button>
      </div>
    </div>
  </div>

  <!-- 4. QR CODE (GERAR / LER) -->
  <div id="tab-qr" class="tab-content">
    <div class="sub-tabs">
      <button id="btnSubGerar" onclick="switchSubQR('gerar')">🎨 Criar QR</button>
      <button id="btnSubLer" class="inactive" onclick="switchSubQR('ler')">📷 Ler com Câmera</button>
    </div>

    <!-- Criar QR Code -->
    <div id="sub-qr-gerar" class="card">
      <label for="textoQr">Texto, link ou código Pix:</label>
      <input type="text" id="textoQr" placeholder="Digite para codificar...">
      <button class="action-btn" onclick="gerarQr()">🔳 Gerar Código</button>
      
      <div id="boxQrResult" style="display: none; text-align: center; margin-top: 14px;">
        <img id="imgQr" src="" alt="QR Code" style="border: 4px solid white; border-radius: 8px; max-width: 170px;">
        <p style="font-size: 12px; opacity: 0.7; margin-top: 6px;">Pronto para leitura ou captura de tela!</p>
      </div>
    </div>

    <!-- Ler QR Code com Câmera -->
    <div id="sub-qr-ler" class="card" style="display: none;">
      <label>Aponte a câmera para um QR Code:</label>
      <div id="reader"></div>
      <div id="scanned-result" class="result-box" style="display: none;">
        <strong>Conteúdo identificado:</strong>
        <p id="scanned-text" style="margin: 8px 0; font-size: 13px;"></p>
        <button id="btnAcessarLido" class="action-btn" style="display: none; padding: 8px; font-size: 13px;">🔗 Abrir Link</button>
      </div>
    </div>
  </div>

  <!-- 5. CALCULADORA DE LINHA -->
  <div id="tab-calc" class="tab-content">
    <div class="card">
      <label for="expressaoCalc">Expressão matemática em linha:</label>
      <input type="text" id="expressaoCalc" placeholder="Ex: (45 * 12) + 350 / 2 - 15">
      <button class="action-btn" onclick="calcularLinha()">🧮 Calcular</button>
      <div id="resultadoCalc" class="result-box" style="display: none; font-weight: bold; font-size: 16px;"></div>
    </div>
  </div>

  <!-- 6. ZIP / UNZIP -->
  <div id="tab-zip" class="tab-content">
    <div class="card" style="margin-bottom: 14px;">
      <label>Compactar (Criar arquivo .ZIP):</label>
      <input type="file" id="ficheirosParaZip" multiple>
      <button class="action-btn" onclick="compactarArquivos()">📦 Baixar Arquivo .ZIP</button>
    </div>

    <div class="card">
      <label>Descompactar (Ler arquivo .ZIP):</label>
      <input type="file" id="ficheiroParaUnzip" accept=".zip">
      <button class="action-btn" onclick="descompactarArquivo()" style="background: #555;">📂 Listar Conteúdo</button>
      <div id="resultadoUnzip" class="result-box" style="display: none;"></div>
    </div>
  </div>

  <script>
    // Inicialização do SDK do Telegram
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      const user = tg.initDataUnsafe?.user;
      if (user) {
        document.getElementById('boasVindas').innerText = `Olá, ${user.first_name}! Escolha uma ferramenta:`;
      }
    }

    // Navegação de Abas Principais
    function switchTab(tabId, btn) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      btn.classList.add('active');
      stopCamera();
    }

    // 1. WhatsApp Direto
    function formatarNum(input) {
      input.value = input.value.replace(/\D/g, '').substring(0, 11);
    }
    function gerarWhats() {
      const num = document.getElementById('numWhats').value;
      if (num.length < 10) return alert('Digite o número com o DDD (ex: 11999999999).');
      const url = `https://wa.me/55${num}`;
      if (tg) tg.openLink(url); else window.open(url, '_blank');
    }

    // 2. Buscas em Lojas e Web
    function buscar(destino) {
      const termo = encodeURIComponent(document.getElementById('termoBusca').value.trim());
      if (!termo) return alert('Digite algo para pesquisar!');
      
      let url = '';
      if (destino === 'google') url = `https://www.google.com/search?q=${termo}`;
      if (destino === 'ml') url = `https://lista.mercadolivre.com.br/${termo}`;
      if (destino === 'amazon') url = `https://www.amazon.com.br/s?k=${termo}`;
      if (destino === 'shein') url = `https://br.shein.com/pdsearch/${termo}`;
      
      if (tg) tg.openLink(url); else window.open(url, '_blank');
    }

    // 3. Encurtador de Link
    async function encurtarLink() {
      const urlOriginal = document.getElementById('linkOriginal').value.trim();
      if (!urlOriginal) return alert('Insira a URL original.');

      const box = document.getElementById('boxLinkResult');
      const label = document.getElementById('linkEncurtado');
      label.innerText = 'Encurtando...';
      box.style.display = 'block';

      try {
        const res = await fetch(`https://is.gd/create.php?format=json&url=${encodeURIComponent(urlOriginal)}`);
        const data = await res.json();
        label.innerText = data.shorturl || 'Erro ao encurtar.';
      } catch (err) {
        label.innerText = 'Erro de conexão ao encurtar.';
      }
    }
    function copiarLink() {
      const text = document.getElementById('linkEncurtado').innerText;
      navigator.clipboard.writeText(text).then(() => alert('Link copiado com sucesso!'));
    }

    // 4. QR Code
    let html5QrcodeScanner = null;
    function switchSubQR(mode) {
      if (mode === 'gerar') {
        document.getElementById('sub-qr-gerar').style.display = 'block';
        document.getElementById('sub-qr-ler').style.display = 'none';
        document.getElementById('btnSubGerar').classList.remove('inactive');
        document.getElementById('btnSubLer').classList.add('inactive');
        stopCamera();
      } else {
        document.getElementById('sub-qr-gerar').style.display = 'none';
        document.getElementById('sub-qr-ler').style.display = 'block';
        document.getElementById('btnSubGerar').classList.add('inactive');
        document.getElementById('btnSubLer').classList.remove('inactive');
        startCamera();
      }
    }
    function gerarQr() {
      const val = document.getElementById('textoQr').value.trim();
      if (!val) return alert('Preencha com texto ou link.');
      document.getElementById('imgQr').src = `https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=${encodeURIComponent(val)}`;
      document.getElementById('boxQrResult').style.display = 'block';
    }
    function startCamera() {
      document.getElementById('scanned-result').style.display = 'none';
      html5QrcodeScanner = new Html5Qrcode("reader");
      html5QrcodeScanner.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 220, height: 220 } },
        onScanSuccess
      ).catch(() => alert('Permissão de câmera não concedida ou erro ao carregar sensor.'));
    }
    function onScanSuccess(decodedText) {
      stopCamera();
      document.getElementById('scanned-text').innerText = decodedText;
      document.getElementById('scanned-result').style.display = 'block';
      const btnLink = document.getElementById('btnAcessarLido');
      if (decodedText.startsWith('http://') || decodedText.startsWith('https://')) {
        btnLink.style.display = 'block';
        btnLink.onclick = () => { if (tg) tg.openLink(decodedText); else window.open(decodedText, '_blank'); };
      } else {
        btnLink.style.display = 'none';
      }
    }
    function stopCamera() {
      if (html5QrcodeScanner) {
        html5QrcodeScanner.stop().then(() => { html5QrcodeScanner = null; }).catch(() => {});
      }
    }

    // 5. Calculadora de Linha
    function calcularLinha() {
      const exp = document.getElementById('expressaoCalc').value.trim();
      const box = document.getElementById('resultadoCalc');
      if (!exp) return alert('Digite a conta.');
      try {
        const resultado = math.evaluate(exp);
        box.innerText = `Resultado: ${resultado}`;
        box.style.display = 'block';
      } catch (err) {
        box.innerText = 'Expressão inválida. Verifique os operadores.';
        box.style.display = 'block';
      }
    }

    // 6. Zip e Unzip
    async function compactarArquivos() {
      const input = document.getElementById('ficheirosParaZip');
      if (input.files.length === 0) return alert('Selecione arquivos para compactar.');
      
      const zip = new JSZip();
      for (let i = 0; i < input.files.length; i++) {
        zip.file(input.files[i].name, input.files[i]);
      }
      
      const blob = await zip.generateAsync({ type: 'blob' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'arquivos_compactados.zip';
      a.click();
    }

    async function descompactarArquivo() {
      const input = document.getElementById('ficheiroParaUnzip');
      const box = document.getElementById('resultadoUnzip');
      if (input.files.length === 0) return alert('Selecione um arquivo .zip primeiro.');

      try {
        const zip = await JSZip.loadAsync(input.files[0]);
        let nomes = '<ul class="file-list">';
        zip.forEach((relativePath) => {
          nomes += `<li>📄 ${relativePath}</li>`;
        });
        nomes += '</ul>';
        box.innerHTML = `<strong>Arquivos contidos no ZIP:</strong>${nomes}`;
        box.style.display = 'block';
      } catch (err) {
        box.innerText = 'Não foi possível ler o arquivo selecionado como ZIP.';
        box.style.display = 'block';
      }
    }
  </script>
</body>
</html>
