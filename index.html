<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Quick Tools</title>
  <!-- Telegram Web App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Leitor de QR Code -->
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <!-- Calculadora matemática -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/12.4.1/math.js"></script>
  <!-- Manipulador de ZIP -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <!-- Tesseract.js OCR v5 -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <!-- Ícones Phosphor -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>

  <style>
    :root {
      --bg: var(--tg-theme-bg-color, #f4f6fb);
      --text: var(--tg-theme-text-color, #1e293b);
      --sec-bg: var(--tg-theme-secondary-bg-color, #ffffff);
      --btn-bg: var(--tg-theme-button-color, #2563eb);
      --btn-text: var(--tg-theme-button-text-color, #ffffff);
      --hint: var(--tg-theme-hint-color, #64748b);
      --accent-green: #10b981;
      --accent-red: #ef4444;
      --accent-orange: #f59e0b;
      --card-border: rgba(0, 0, 0, 0.07);
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.05);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 14px 14px 50px 14px;
      min-height: 100vh;
      user-select: none;
    }

    header {
      text-align: center;
      margin-bottom: 12px;
    }
    header h1 {
      font-size: 22px;
      font-weight: 800;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    header p.welcome {
      font-size: 13px;
      color: var(--hint);
      margin: 4px 0 0 0;
    }

    .tabs-wrapper {
      position: sticky;
      top: 0;
      background: var(--bg);
      z-index: 50;
      padding-bottom: 10px;
      overflow-x: auto;
      white-space: nowrap;
      -webkit-overflow-scrolling: touch;
      display: flex;
      gap: 6px;
      margin: 0 -14px 14px -14px;
      padding-left: 14px;
      padding-right: 14px;
    }
    .tabs-wrapper::-webkit-scrollbar {
      display: none;
    }

    .tab-btn {
      background: var(--sec-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 8px 14px;
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      flex-shrink: 0;
      box-shadow: var(--shadow-sm);
    }
    .tab-btn.active {
      background: var(--btn-bg);
      color: var(--btn-text);
      border-color: var(--btn-bg);
      transform: translateY(-1px);
    }

    .tab-content {
      display: none;
      animation: fadeIn 0.2s ease-in-out;
    }
    .tab-content.active {
      display: block;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card {
      background: var(--sec-bg);
      border-radius: 16px;
      padding: 16px;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--card-border);
      margin-bottom: 14px;
    }

    label {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--hint);
      display: block;
      margin-bottom: 6px;
    }

    input[type="text"],
    input[type="tel"],
    input[type="url"],
    input[type="number"],
    select,
    textarea {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1.5px solid rgba(0, 0, 0, 0.1);
      font-size: 14px;
      background: var(--bg);
      color: var(--text);
      margin-bottom: 12px;
      outline: none;
      transition: border-color 0.2s ease;
      font-family: inherit;
    }
    input:focus, select:focus, textarea:focus {
      border-color: var(--btn-bg);
    }

    button.action-btn {
      background-color: var(--btn-bg);
      color: var(--btn-text);
      border: none;
      padding: 13px 16px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: filter 0.15s ease, transform 0.1s ease;
    }
    button.action-btn:active {
      transform: scale(0.98);
      filter: brightness(0.92);
    }

    .grid-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .grid-buttons button {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--card-border);
      padding: 12px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s ease;
    }
    .grid-buttons button:active {
      background: rgba(0, 0, 0, 0.05);
    }

    .result-box {
      background: var(--bg);
      border: 1.5px dashed rgba(0, 0, 0, 0.15);
      padding: 12px;
      border-radius: 10px;
      margin-top: 12px;
      word-break: break-all;
      font-size: 13px;
      position: relative;
    }

    .sub-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }
    .sub-tabs button {
      flex: 1;
      padding: 9px;
      border-radius: 8px;
      border: 1.5px solid var(--btn-bg);
      background: var(--btn-bg);
      color: var(--btn-text);
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
    }
    .sub-tabs button.inactive {
      background: transparent;
      color: var(--btn-bg);
    }

    /* Barra de progresso para OCR e Uploads */
    .progress-bar-bg {
      width: 100%;
      height: 8px;
      background: rgba(0,0,0,0.1);
      border-radius: 8px;
      overflow: hidden;
      margin: 10px 0 6px 0;
      display: none;
    }
    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: var(--btn-bg);
      border-radius: 8px;
      transition: width 0.2s ease;
    }

    /* Notificação flutuante tipo Toast */
    #toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: rgba(17, 24, 39, 0.95);
      color: #ffffff;
      padding: 10px 18px;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 500;
      box-shadow: 0 4px 15px rgba(0,0,0,0.25);
      transition: transform 0.3s cubic-bezier(0.18, 0.89, 0.32, 1.28);
      z-index: 1000;
      display: flex;
      align-items: center;
      gap: 8px;
      pointer-events: none;
    }
    #toast.show {
      transform: translateX(-50%) translateY(0);
    }

    .mic-recording {
      animation: pulseRecord 1.5s infinite;
      background-color: var(--accent-red) !important;
      color: #fff !important;
    }
    @keyframes pulseRecord {
      0% { opacity: 1; }
      50% { opacity: 0.6; }
      100% { opacity: 1; }
    }

    video {
      width: 100%;
      max-height: 220px;
      border-radius: 10px;
      background: #000;
      margin-bottom: 10px;
    }

    .ocr-preview-box {
      max-height: 220px;
      width: 100%;
      object-fit: contain;
      border-radius: 10px;
      border: 1px solid var(--card-border);
      background: #000;
      margin-bottom: 12px;
      display: none;
    }
  </style>
</head>
<body>

  <!-- Notificação Flutuante -->
  <div id="toast"><i class="ph ph-info"></i><span id="toast-text">Mensagem</span></div>

  <header>
    <h1>⚡ Quick Tools</h1>
    <p class="welcome" id="boasVindas">Selecione uma ferramenta rápida abaixo:</p>
  </header>

  <nav class="tabs-wrapper" id="navTabs">
    <button class="tab-btn active" onclick="switchTab('tab-whats', this)">💬 WhatsApp</button>
    <button class="tab-btn" onclick="switchTab('tab-ocr', this)">📝 Imagem p/ Texto</button>
    <button class="tab-btn" onclick="switchTab('tab-busca', this)">🔍 Buscas</button>
    <button class="tab-btn" onclick="switchTab('tab-links', this)">🔗 Links</button>
    <button class="tab-btn" onclick="switchTab('tab-tradutor', this)">🌐 Tradutor</button>
    <button class="tab-btn" onclick="switchTab('tab-voz', this)">🎙️ Voz p/ Texto</button>
    <button class="tab-btn" onclick="switchTab('tab-file-link', this)">📁 Arquivo p/ Link</button>
    <button class="tab-btn" onclick="switchTab('tab-trimmer', this)">✂️ Cortar Vídeo</button>
    <button class="tab-btn" onclick="switchTab('tab-downloader', this)">📥 Baixar Mídia</button>
    <button class="tab-btn" onclick="switchTab('tab-qr', this)">🔳 QR Code</button>
    <button class="tab-btn" onclick="switchTab('tab-calc', this)">🔢 Calculadora</button>
    <button class="tab-btn" onclick="switchTab('tab-zip', this)">📦 Zip / Unzip</button>
  </nav>

  <!-- 1. WHATSAPP DIRETO -->
  <div id="tab-whats" class="tab-content active">
    <div class="card">
      <label for="numWhats">Número com DDD (Brasil):</label>
      <input type="tel" id="numWhats" placeholder="Ex: 11999999999" maxlength="11" oninput="formatarNum(this)">
      <button class="action-btn" onclick="gerarWhats()">
        <i class="ph ph-whatsapp-logo"></i> Abrir Chat Direto
      </button>
    </div>
  </div>

  <!-- 2. OCR / IMAGEM PARA TEXTO (Tesseract.js) -->
  <div id="tab-ocr" class="tab-content">
    <div class="card">
      <label>1. Carregar Foto ou Documento:</label>
      <input type="file" id="ocrInputFile" accept="image/*" onchange="carregarImagemOcr(this)">
      
      <img id="imgOcrPreview" class="ocr-preview-box" alt="Prévia da Imagem">

      <label for="ocrLangSelect">2. Idioma do Texto na Imagem:</label>
      <select id="ocrLangSelect">
        <option value="por" selected>🇧🇷 Português (por)</option>
        <option value="eng">🇺🇸 Inglês (eng)</option>
        <option value="spa">🇪🇸 Espanhol (spa)</option>
      </select>

      <button id="btnIniciarOcr" class="action-btn" onclick="executarOCR()" style="background: var(--btn-bg);">
        <i class="ph ph-text-aa"></i> Extrair Texto da Imagem
      </button>

      <!-- Progresso e Status -->
      <div id="ocrProgressWrapper" class="progress-bar-bg">
        <div id="ocrProgressBar" class="progress-bar-fill"></div>
      </div>
      <p id="ocrStatusMsg" style="font-size: 12px; color: var(--hint); text-align: center; margin: 4px 0 0 0; display: none;"></p>

      <!-- Resultado do OCR -->
      <div id="boxOcrResult" style="display: none; margin-top: 14px;">
        <label>Texto Extraído:</label>
        <textarea id="textoOcrResultado" rows="6" placeholder="O texto identificado aparecerá aqui..."></textarea>
        
        <div class="grid-buttons" style="margin-bottom: 8px;">
          <button onclick="copiarTexto('textoOcrResultado', true)" style="background: var(--accent-green); color: #fff;">
            <i class="ph ph-copy"></i> Copiar Texto
          </button>
          <button onclick="enviarOcrParaTradutor()" style="background: var(--btn-bg); color: #fff;">
            <i class="ph ph-translate"></i> Traduzir Texto
          </button>
        </div>
        <button onclick="limparOcr()" class="action-btn" style="background: transparent; color: var(--hint); border: 1px solid var(--card-border); padding: 8px; font-size: 13px;">
          <i class="ph ph-trash"></i> Limpar OCR
        </button>
      </div>
    </div>
  </div>

  <!-- 3. BUSCAS GERAIS E LOJAS -->
  <div id="tab-busca" class="tab-content">
    <div class="card">
      <label for="termoBusca">Termo ou produto pesquisado:</label>
      <input type="text" id="termoBusca" placeholder="Ex: mouse sem fio ergonômico">
      <div class="grid-buttons">
        <button onclick="buscar('google')"><i class="ph ph-google-logo"></i> Google</button>
        <button onclick="buscar('ml')"><i class="ph ph-shopping-bag"></i> Mercado Livre</button>
        <button onclick="buscar('amazon')"><i class="ph ph-amazon-logo"></i> Amazon</button>
        <button onclick="buscar('shein')"><i class="ph ph-t-shirt"></i> Shein</button>
      </div>
    </div>
  </div>

  <!-- 4. ENCURTAR LINKS -->
  <div id="tab-links" class="tab-content">
    <div class="card">
      <label for="linkOriginal">Cole a URL longa:</label>
      <input type="url" id="linkOriginal" placeholder="https://exemplo.com/pagina-muito-longa">
      <button class="action-btn" onclick="encurtarLink()">
        <i class="ph ph-link"></i> Encurtar Link
      </button>
      
      <div id="boxLinkResult" class="result-box" style="display: none;">
        <span id="linkEncurtado" style="font-weight: 600;"></span>
        <button class="action-btn" onclick="copiarTexto('linkEncurtado')" style="margin-top: 10px; padding: 9px; font-size: 13px; background: var(--accent-green);">
          <i class="ph ph-copy"></i> Copiar Link
        </button>
      </div>
    </div>
  </div>

  <!-- 5. TRADUTOR MULTILÍNGUE (Google & DeepL Direct) -->
  <div id="tab-tradutor" class="tab-content">
    <div class="card">
      <div style="display: flex; gap: 8px; align-items: center; margin-bottom: 8px;">
        <select id="langOrigem" style="margin-bottom: 0;">
          <option value="pt" selected>Português</option>
          <option value="en">Inglês</option>
          <option value="es">Espanhol</option>
          <option value="fr">Francês</option>
          <option value="de">Alemão</option>
          <option value="it">Italiano</option>
        </select>
        <button onclick="inverterIdiomas()" style="background: none; border: none; font-size: 20px; cursor: pointer; color: var(--btn-bg); padding: 0 4px;">
          <i class="ph ph-arrows-left-right"></i>
        </button>
        <select id="langDestino" style="margin-bottom: 0;">
          <option value="en" selected>Inglês</option>
          <option value="pt">Português</option>
          <option value="es">Espanhol</option>
          <option value="fr">Francês</option>
          <option value="de">Alemão</option>
          <option value="it">Italiano</option>
        </select>
      </div>
      <textarea id="textoParaTraduzir" rows="3" placeholder="Digite o texto que deseja traduzir..."></textarea>
      <button class="action-btn" onclick="executarTraducao()">
        <i class="ph ph-translate"></i> Traduzir Agora
      </button>

      <div class="grid-buttons" style="margin-top: 10px;">
        <button onclick="abrirTradutorExterno('google')"><i class="ph ph-arrow-square-out"></i> Abrir Google</button>
        <button onclick="abrirTradutorExterno('deepl')"><i class="ph ph-arrow-square-out"></i> Abrir DeepL</button>
      </div>

      <div id="boxTraducao" class="result-box" style="display: none;">
        <p id="textoTraduzido" style="margin: 0; line-height: 1.4;"></p>
        <button class="action-btn" onclick="copiarTexto('textoTraduzido')" style="margin-top: 10px; padding: 8px; font-size: 13px; background: var(--accent-green);">
          <i class="ph ph-copy"></i> Copiar Tradução
        </button>
      </div>
    </div>
  </div>

  <!-- 6. VOZ PARA TEXTO -->
  <div id="tab-voz" class="tab-content">
    <div class="card">
      <label>Reconhecimento de Fala:</label>
      <div style="display: flex; gap: 8px; align-items: center; margin-bottom: 10px;">
        <select id="vozIdioma" style="margin-bottom: 0;">
          <option value="pt-BR" selected>Português (Brasil)</option>
          <option value="en-US">English (US)</option>
          <option value="es-ES">Español</option>
        </select>
        <button id="btnRecVoz" class="action-btn" onclick="alternarGravacaoVoz()" style="flex: 1.2;">
          <i class="ph ph-microphone"></i> <span id="lblBtnVoz">Gravar</span>
        </button>
      </div>
      <textarea id="resultadoVoz" rows="4" placeholder="O texto reconhecido aparecerá aqui..."></textarea>
      <button class="action-btn" onclick="copiarTexto('resultadoVoz', true)" style="background: var(--accent-green);">
        <i class="ph ph-copy"></i> Copiar Transcrição
      </button>
    </div>
  </div>

  <!-- 7. ARQUIVO PARA LINK -->
  <div id="tab-file-link" class="tab-content">
    <div class="card">
      <label>Gerar Link Direto de Arquivo:</label>
      <p style="font-size: 13px; color: var(--hint); margin: 0 0 10px 0;">Envie fotos ou documentos para gerar uma URL de compartilhamento temporária.</p>
      <input type="file" id="arquivoParaUpload">
      <button id="btnUploadFile" class="action-btn" onclick="enviarArquivoParaLink()">
        <i class="ph ph-upload-simple"></i> Enviar e Gerar Link
      </button>
      <div id="boxUploadResult" class="result-box" style="display: none;">
        <span id="labelUploadResult"></span>
        <button id="btnCopiarLinkUp" class="action-btn" onclick="copiarTexto('labelUploadResult')" style="margin-top: 10px; padding: 8px; font-size: 13px; background: var(--accent-green); display: none;">
          <i class="ph ph-copy"></i> Copiar Link Gerado
        </button>
      </div>
    </div>
  </div>

  <!-- 8. CORTAR VÍDEO (Trimmer no Cliente) -->
  <div id="tab-trimmer" class="tab-content">
    <div class="card">
      <label>Cortar Trecho de Vídeo:</label>
      <input type="file" id="videoFilePicker" accept="video/*" onchange="carregarVideoLocal(this)">
      
      <div id="trimmerContainer" style="display: none;">
        <video id="videoPreview" controls playsinline></video>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px;">
          <div>
            <label>Início (segundos):</label>
            <input type="number" id="trimStart" value="0" min="0" step="0.5">
          </div>
          <div>
            <label>Fim (segundos):</label>
            <input type="number" id="trimEnd" value="5" min="0.5" step="0.5">
          </div>
        </div>
        <p id="videoDurationLabel" style="font-size: 12px; color: var(--hint); margin: 0 0 12px 0;">Duração total: 0s</p>
        <button id="btnTrimVideo" class="action-btn" onclick="iniciarCorteDeVideo()">
          <i class="ph ph-scissors"></i> Processar e Baixar Trecho
        </button>
        <p id="trimStatus" style="font-size: 13px; text-align: center; margin-top: 8px; display: none;"></p>
      </div>
    </div>
  </div>

  <!-- 9. BAIXADOR DE VÍDEOS -->
  <div id="tab-downloader" class="tab-content">
    <div class="card">
      <label for="urlDownloader">Link do Vídeo (YouTube, TikTok, Instagram):</label>
      <input type="url" id="urlDownloader" placeholder="Cole o link do Reels, Shorts ou TikTok">
      
      <p style="font-size: 12px; color: var(--hint); margin: 0 0 12px 0;">Escolha uma rota direta para extrair ou baixar sem marca d'água:</p>
      <div class="grid-buttons">
        <button onclick="abrirServicoDownload('cobalt')"><i class="ph ph-lightning"></i> Cobalt Tools</button>
        <button onclick="abrirServicoDownload('snapinsta')"><i class="ph ph-instagram-logo"></i> SnapInsta</button>
        <button onclick="abrirServicoDownload('ssstik')"><i class="ph ph-tiktok-logo"></i> SSSTikTok</button>
        <button onclick="abrirServicoDownload('savefrom')"><i class="ph ph-download-simple"></i> SaveFrom</button>
      </div>
    </div>
  </div>

  <!-- 10. QR CODE (GERAR / LER COM CÂMERA) -->
  <div id="tab-qr" class="tab-content">
    <div class="sub-tabs">
      <button id="btnSubGerar" onclick="switchSubQR('gerar')"><i class="ph ph-paint-brush"></i> Criar QR</button>
      <button id="btnSubLer" class="inactive" onclick="switchSubQR('ler')"><i class="ph ph-camera"></i> Ler Câmera</button>
    </div>

    <!-- Gerar QR -->
    <div id="sub-qr-gerar" class="card">
      <label for="textoQr">Texto, link ou chave Pix:</label>
      <input type="text" id="textoQr" placeholder="Digite para codificar...">
      <button class="action-btn" onclick="gerarQr()">
        <i class="ph ph-qr-code"></i> Gerar Código
      </button>
      <div id="boxQrResult" style="display: none; text-align: center; margin-top: 14px;">
        <img id="imgQr" src="" alt="QR Code" style="border: 4px solid white; border-radius: 12px; max-width: 180px; box-shadow: var(--shadow-sm);">
        <p style="font-size: 12px; color: var(--hint); margin-top: 6px;">Toque e segure na imagem para salvar.</p>
      </div>
    </div>

    <!-- Ler QR -->
    <div id="sub-qr-ler" class="card" style="display: none;">
      <label>Aponte a câmera do dispositivo:</label>
      <div id="reader" style="width: 100%; border-radius: 10px; overflow: hidden; background: #000;"></div>
      <div id="scanned-result" class="result-box" style="display: none;">
        <strong>Conteúdo Lido:</strong>
        <p id="scanned-text" style="margin: 8px 0; font-size: 13px;"></p>
        <button id="btnAcessarLido" class="action-btn" style="display: none; padding: 8px; font-size: 13px;">
          <i class="ph ph-arrow-square-out"></i> Acessar Link
        </button>
      </div>
    </div>
  </div>

  <!-- 11. CALCULADORA DE LINHA -->
  <div id="tab-calc" class="tab-content">
    <div class="card">
      <label for="expressaoCalc">Expressão Matemática:</label>
      <input type="text" id="expressaoCalc" placeholder="Ex: (45 * 12) + 350 / 2 - 15">
      <div class="grid-buttons" style="margin-bottom: 12px;">
        <button onclick="inserirSimboloCalc(' + ')">+</button>
        <button onclick="inserirSimboloCalc(' - ')">-</button>
        <button onclick="inserirSimboloCalc(' * ')">×</button>
        <button onclick="inserirSimboloCalc(' / ')">÷</button>
      </div>
      <button class="action-btn" onclick="calcularLinha()">
        <i class="ph ph-equals"></i> Calcular
      </button>
      <div id="resultadoCalc" class="result-box" style="display: none; font-weight: bold; font-size: 16px; text-align: center;"></div>
    </div>
  </div>

  <!-- 12. ZIP / UNZIP -->
  <div id="tab-zip" class="tab-content">
    <div class="card" style="margin-bottom: 14px;">
      <label>Compactar Arquivos (.ZIP):</label>
      <input type="file" id="ficheirosParaZip" multiple>
      <button class="action-btn" onclick="compactarArquivos()">
        <i class="ph ph-archive"></i> Gerar e Baixar .ZIP
      </button>
    </div>

    <div class="card">
      <label>Descompactar e Visualizar (.ZIP):</label>
      <input type="file" id="ficheiroParaUnzip" accept=".zip">
      <button class="action-btn" onclick="descompactarArquivo()" style="background: var(--hint);">
        <i class="ph ph-folder-open"></i> Extrair / Listar Arquivos
      </button>
      <div id="resultadoUnzip" class="result-box" style="display: none;"></div>
    </div>
  </div>

  <script>
    // Inicialização do Telegram WebApp SDK
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      const user = tg.initDataUnsafe?.user;
      if (user) {
        document.getElementById('boasVindas').innerText = `Olá, ${user.first_name}! Selecione uma ferramenta:`;
      }
    }

    // Feedback tátil e alertas suaves (Toast)
    function triggerHaptic(type = 'impact') {
      if (tg?.HapticFeedback) {
        if (type === 'impact') tg.HapticFeedback.impactOccurred('medium');
        if (type === 'success') tg.HapticFeedback.notificationOccurred('success');
        if (type === 'error') tg.HapticFeedback.notificationOccurred('error');
      }
    }

    function showToast(mensagem) {
      const toast = document.getElementById('toast');
      const text = document.getElementById('toast-text');
      text.innerText = mensagem;
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, 2400);
    }

    function copiarTexto(elementId, isInput = false) {
      triggerHaptic('impact');
      const el = document.getElementById(elementId);
      const text = isInput ? el.value : el.innerText;
      if (!text || !text.trim()) {
        showToast("Nada para copiar.");
        return;
      }

      const tempInput = document.createElement("textarea");
      tempInput.value = text;
      document.body.appendChild(tempInput);
      tempInput.select();
      try {
        document.execCommand("copy");
        showToast("Copiado com sucesso!");
        triggerHaptic('success');
      } catch (err) {
        showToast("Erro ao copiar.");
      }
      document.body.removeChild(tempInput);
    }

    function switchTab(tabId, btn) {
      triggerHaptic('impact');
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      const target = document.getElementById(tabId);
      if (target) target.classList.add('active');
      if (btn) btn.classList.add('active');
      stopCamera();
    }

    // 1. WhatsApp Direto
    function formatarNum(input) {
      input.value = input.value.replace(/\D/g, '').substring(0, 11);
    }
    function gerarWhats() {
      triggerHaptic('impact');
      const num = document.getElementById('numWhats').value;
      if (num.length < 10) {
        triggerHaptic('error');
        return showToast('Insira DDD + Telefone completo.');
      }
      const url = `https://wa.me/55${num}`;
      if (tg) tg.openLink(url); else window.open(url, '_blank');
    }

    // 2. OCR / Image-to-Text via Tesseract.js
    let ocrImageFile = null;

    function carregarImagemOcr(input) {
      if (!input.files || input.files.length === 0) return;
      ocrImageFile = input.files[0];
      const preview = document.getElementById('imgOcrPreview');
      preview.src = URL.createObjectURL(ocrImageFile);
      preview.style.display = 'block';
      triggerHaptic('impact');
    }

    async function executarOCR() {
      triggerHaptic('impact');
      if (!ocrImageFile) {
        triggerHaptic('error');
        return showToast('Selecione ou tire uma foto primeiro.');
      }

      const btn = document.getElementById('btnIniciarOcr');
      const progressBg = document.getElementById('ocrProgressWrapper');
      const progressBar = document.getElementById('ocrProgressBar');
      const statusMsg = document.getElementById('ocrStatusMsg');
      const resultBox = document.getElementById('boxOcrResult');
      const resultTextarea = document.getElementById('textoOcrResultado');
      const lang = document.getElementById('ocrLangSelect').value;

      btn.disabled = true;
      btn.style.opacity = '0.6';
      progressBg.style.display = 'block';
      progressBar.style.width = '0%';
      statusMsg.style.display = 'block';
      statusMsg.innerText = 'Inicializando motor OCR...';

      try {
        const worker = await Tesseract.createWorker(lang, 1, {
          logger: m => {
            if (m.status === 'recognizing text') {
              const pct = Math.round(m.progress * 100);
              progressBar.style.width = `${pct}%`;
              statusMsg.innerText = `Reconhecendo texto... ${pct}%`;
            } else if (m.status) {
              statusMsg.innerText = `${m.status}...`;
            }
          }
        });

        const ret = await worker.recognize(ocrImageFile);
        await worker.terminate();

        const cleanText = ret.data.text.trim();
        if (cleanText) {
          resultTextarea.value = cleanText;
          resultBox.style.display = 'block';
          statusMsg.innerText = 'Reconhecimento concluído!';
          triggerHaptic('success');
          showToast('Texto reconhecido com sucesso!');
        } else {
          statusMsg.innerText = 'Nenhum caractere nítido encontrado.';
          showToast('Nenhum texto identificado na foto.');
        }

      } catch (err) {
        console.error(err);
        triggerHaptic('error');
        statusMsg.innerText = 'Falha no processamento da imagem.';
        showToast('Erro ao executar OCR.');
      } finally {
        btn.disabled = false;
        btn.style.opacity = '1';
        setTimeout(() => {
          progressBg.style.display = 'none';
        }, 1200);
      }
    }

    function enviarOcrParaTradutor() {
      const text = document.getElementById('textoOcrResultado').value.trim();
      if (!text) return showToast('Nenhum texto para traduzir.');

      document.getElementById('textoParaTraduzir').value = text;
      // Localiza o botão da aba Tradutor e aciona
      const btnTradutor = Array.from(document.querySelectorAll('.tab-btn')).find(b => b.innerText.includes('Tradutor'));
      if (btnTradutor) {
        switchTab('tab-tradutor', btnTradutor);
        showToast('Texto enviado para o Tradutor!');
      }
    }

    function limparOcr() {
      document.getElementById('ocrInputFile').value = '';
      ocrImageFile = null;
      document.getElementById('imgOcrPreview').style.display = 'none';
      document.getElementById('boxOcrResult').style.display = 'none';
      document.getElementById('textoOcrResultado').value = '';
      document.getElementById('ocrStatusMsg').style.display = 'none';
      showToast('OCR reiniciado.');
    }

    // 3. Buscas
    function buscar(destino) {
      triggerHaptic('impact');
      const termo = encodeURIComponent(document.getElementById('termoBusca').value.trim());
      if (!termo) {
        triggerHaptic('error');
        return showToast('Digite um termo para pesquisar.');
      }
      
      let url = '';
      if (destino === 'google') url = `https://www.google.com/search?q=${termo}`;
      if (destino === 'ml') url = `https://lista.mercadolivre.com.br/${termo}`;
      if (destino === 'amazon') url = `https://www.amazon.com.br/s?k=${termo}`;
      if (destino === 'shein') url = `https://br.shein.com/pdsearch/${termo}`;
      
      if (tg) tg.openLink(url); else window.open(url, '_blank');
    }

    // 4. Encurtar Links
    async function encurtarLink() {
      triggerHaptic('impact');
      const urlOriginal = document.getElementById('linkOriginal').value.trim();
      if (!urlOriginal) {
        triggerHaptic('error');
        return showToast('Insira a URL original.');
      }

      const box = document.getElementById('boxLinkResult');
      const label = document.getElementById('linkEncurtado');
      label.innerText = 'Encurtando...';
      box.style.display = 'block';

      try {
        const res = await fetch(`https://is.gd/create.php?format=json&url=${encodeURIComponent(urlOriginal)}`);
        const data = await res.json();
        if (data.shorturl) {
          label.innerText = data.shorturl;
          triggerHaptic('success');
        } else {
          label.innerText = 'Erro ao encurtar o link.';
        }
      } catch (err) {
        label.innerText = 'Falha de conexão com a API de encurtamento.';
        triggerHaptic('error');
      }
    }

    // 5. Tradutor (MyMemory API + DeepL & Google links)
    function inverterIdiomas() {
      triggerHaptic('impact');
      const orig = document.getElementById('langOrigem');
      const dest = document.getElementById('langDestino');
      const temp = orig.value;
      orig.value = dest.value;
      dest.value = temp;
    }

    async function executarTraducao() {
      triggerHaptic('impact');
      const texto = document.getElementById('textoParaTraduzir').value.trim();
      const orig = document.getElementById('langOrigem').value;
      const dest = document.getElementById('langDestino').value;
      if (!texto) return showToast('Digite o texto a ser traduzido.');

      const box = document.getElementById('boxTraducao');
      const lbl = document.getElementById('textoTraduzido');
      lbl.innerText = 'Traduzindo...';
      box.style.display = 'block';

      try {
        const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(texto)}&langpair=${orig}|${dest}`;
        const res = await fetch(url);
        const data = await res.json();
        if (data.responseData?.translatedText) {
          lbl.innerText = data.responseData.translatedText;
          triggerHaptic('success');
        } else {
          lbl.innerText = 'Não foi possível traduzir.';
        }
      } catch (e) {
        lbl.innerText = 'Erro ao conectar ao serviço de tradução.';
        triggerHaptic('error');
      }
    }

    function abrirTradutorExterno(tipo) {
      triggerHaptic('impact');
      const texto = encodeURIComponent(document.getElementById('textoParaTraduzir').value.trim());
      const orig = document.getElementById('langOrigem').value;
      const dest = document.getElementById('langDestino').value;
      let url = '';
      if (tipo === 'google') {
        url = `https://translate.google.com/?sl=${orig}&tl=${dest}&text=${texto}&op=translate`;
      } else {
        url = `https://www.deepl.com/translator#${orig}/${dest}/${texto}`;
      }
      if (tg) tg.openLink(url); else window.open(url, '_blank');
    }

    // 6. Voz para Texto
    let recognition = null;
    let isRecording = false;

    function alternarGravacaoVoz() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        triggerHaptic('error');
        return showToast('Reconhecimento de fala indisponível neste navegador.');
      }

      const btn = document.getElementById('btnRecVoz');
      const lbl = document.getElementById('lblBtnVoz');
      const textarea = document.getElementById('resultadoVoz');
      const lang = document.getElementById('vozIdioma').value;

      if (!isRecording) {
        recognition = new SpeechRecognition();
        recognition.lang = lang;
        recognition.continuous = true;
        recognition.interimResults = true;

        recognition.onstart = () => {
          isRecording = true;
          btn.classList.add('mic-recording');
          lbl.innerText = 'Parar';
          triggerHaptic('impact');
        };

        recognition.onresult = (event) => {
          let trans = '';
          for (let i = 0; i < event.results.length; i++) {
            trans += event.results[i][0].transcript;
          }
          textarea.value = trans;
        };

        recognition.onerror = () => {
          isRecording = false;
          btn.classList.remove('mic-recording');
          lbl.innerText = 'Gravar';
          showToast('Permissão de microfone negada ou erro.');
        };

        recognition.onend = () => {
          isRecording = false;
          btn.classList.remove('mic-recording');
          lbl.innerText = 'Gravar';
        };

        recognition.start();
      } else {
        if (recognition) recognition.stop();
        isRecording = false;
        btn.classList.remove('mic-recording');
        lbl.innerText = 'Gravar';
        triggerHaptic('impact');
      }
    }

    // 7. Arquivo para Link
    async function enviarArquivoParaLink() {
      triggerHaptic('impact');
      const input = document.getElementById('arquivoParaUpload');
      if (!input.files || input.files.length === 0) {
        return showToast('Selecione um arquivo primeiro.');
      }

      const box = document.getElementById('boxUploadResult');
      const label = document.getElementById('labelUploadResult');
      const btnCopiar = document.getElementById('btnCopiarLinkUp');
      const file = input.files[0];

      label.innerText = 'Enviando arquivo (aguarde)...';
      btnCopiar.style.display = 'none';
      box.style.display = 'block';

      const formData = new FormData();
      formData.append('file', file);

      try {
        const res = await fetch('https://tmpfiles.org/api/v1/upload', {
          method: 'POST',
          body: formData
        });
        const data = await res.json();
        if (data.status === 'success' && data.data?.url) {
          const directUrl = data.data.url.replace('tmpfiles.org/', 'tmpfiles.org/dl/');
          label.innerText = directUrl;
          btnCopiar.style.display = 'block';
          triggerHaptic('success');
        } else {
          label.innerText = 'Erro ao processar o upload do arquivo.';
        }
      } catch (err) {
        label.innerText = 'Erro na conexão durante o upload.';
        triggerHaptic('error');
      }
    }

    // 8. Video Trimmer
    let loadedVideoBlob = null;
    function carregarVideoLocal(input) {
      if (!input.files || input.files.length === 0) return;
      const file = input.files[0];
      loadedVideoBlob = file;
      const videoEl = document.getElementById('videoPreview');
      videoEl.src = URL.createObjectURL(file);
      videoEl.onloadedmetadata = () => {
        document.getElementById('trimmerContainer').style.display = 'block';
        document.getElementById('videoDurationLabel').innerText = `Duração total: ${videoEl.duration.toFixed(1)}s`;
        document.getElementById('trimEnd').value = Math.min(5, videoEl.duration).toFixed(1);
      };
    }

    async function iniciarCorteDeVideo() {
      triggerHaptic('impact');
      const video = document.getElementById('videoPreview');
      const start = parseFloat(document.getElementById('trimStart').value) || 0;
      const end = parseFloat(document.getElementById('trimEnd').value) || video.duration;
      const status = document.getElementById('trimStatus');

      if (start >= end || end > video.duration) {
        triggerHaptic('error');
        return showToast('Intervalo de início e fim inválido.');
      }

      status.style.display = 'block';
      status.innerText = 'Processando trecho selecionado...';

      try {
        const stream = video.captureStream ? video.captureStream() : video.mozCaptureStream();
        const recorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
        const chunks = [];

        recorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
        recorder.onstop = () => {
          const blob = new Blob(chunks, { type: 'video/webm' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `video_corte_${start}s_${end}s.webm`;
          a.click();
          status.innerText = 'Corte concluído e download pronto!';
          triggerHaptic('success');
        };

        video.currentTime = start;
        await video.play();
        recorder.start();

        const durationMs = (end - start) * 1000;
        setTimeout(() => {
          recorder.stop();
          video.pause();
        }, durationMs);

      } catch (err) {
        status.innerText = 'Gravação direta não suportada. Baixando arquivo original...';
        const a = document.createElement('a');
        a.href = URL.createObjectURL(loadedVideoBlob);
        a.download = loadedVideoBlob.name;
        a.click();
      }
    }

    // 9. Baixador de Vídeos
    function abrirServicoDownload(servico) {
      triggerHaptic('impact');
      const link = document.getElementById('urlDownloader').value.trim();
      if (!link) return showToast('Cole o link do vídeo primeiro.');

      let targetUrl = '';
      if (servico === 'cobalt') targetUrl = `https://cobalt.tools/#${encodeURIComponent(link)}`;
      if (servico === 'snapinsta') targetUrl = `https://snapinsta.app/`;
      if (servico === 'ssstik') targetUrl = `https://ssstik.io/`;
      if (servico === 'savefrom') targetUrl = `https://en.savefrom.net/`;

      if (tg) tg.openLink(targetUrl); else window.open(targetUrl, '_blank');
    }

    // 10. QR Code
    let html5QrcodeScanner = null;
    function switchSubQR(mode) {
      triggerHaptic('impact');
      if (mode === 'gerar') {
        document.getElementById('sub-qr-gerar').style.display = 'block';
        document.getElementById('sub-qr-ler').style.display = 'none';
        document.getElementById('btnSubGerar').classList.remove('inactive');
        document.getElementById('btnSubLer').classList.add('inactive');
        stopCamera();
      } else {
        document.getElementById('sub-qr-gerar').style.display = 'none';
        document.getElementById('sub-qr-ler').style.display = 'block';
        document.getElementById('btnSubGerar').classList.add('inactive');
        document.getElementById('btnSubLer').classList.remove('inactive');
        startCamera();
      }
    }

    function gerarQr() {
      triggerHaptic('impact');
      const val = document.getElementById('textoQr').value.trim();
      if (!val) return showToast('Preencha com texto ou link.');
      document.getElementById('imgQr').src = `https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=${encodeURIComponent(val)}`;
      document.getElementById('boxQrResult').style.display = 'block';
      triggerHaptic('success');
    }

    function startCamera() {
      document.getElementById('scanned-result').style.display = 'none';
      html5QrcodeScanner = new Html5Qrcode("reader");
      html5QrcodeScanner.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 220, height: 220 } },
        onScanSuccess
      ).catch(() => showToast('Permissão de câmera não concedida.'));
    }

    function onScanSuccess(decodedText) {
      stopCamera();
      triggerHaptic('success');
      document.getElementById('scanned-text').innerText = decodedText;
      document.getElementById('scanned-result').style.display = 'block';
      const btnLink = document.getElementById('btnAcessarLido');
      if (decodedText.startsWith('http://') || decodedText.startsWith('https://')) {
        btnLink.style.display = 'flex';
        btnLink.onclick = () => { if (tg) tg.openLink(decodedText); else window.open(decodedText, '_blank'); };
      } else {
        btnLink.style.display = 'none';
      }
    }

    function stopCamera() {
      if (html5QrcodeScanner) {
        html5QrcodeScanner.stop().then(() => { html5QrcodeScanner = null; }).catch(() => {});
      }
    }

    // 11. Calculadora de Linha
    function inserirSimboloCalc(simbolo) {
      triggerHaptic('impact');
      const input = document.getElementById('expressaoCalc');
      input.value += simbolo;
      input.focus();
    }

    function calcularLinha() {
      triggerHaptic('impact');
      const exp = document.getElementById('expressaoCalc').value.trim();
      const box = document.getElementById('resultadoCalc');
      if (!exp) return showToast('Digite a expressão matemática.');
      try {
        const resultado = math.evaluate(exp);
        box.innerText = `= ${resultado}`;
        box.style.display = 'block';
        triggerHaptic('success');
      } catch (err) {
        box.innerText = 'Expressão matemática inválida.';
        box.style.display = 'block';
        triggerHaptic('error');
      }
    }

    // 12. Zip e Unzip
    async function compactarArquivos() {
      triggerHaptic('impact');
      const input = document.getElementById('ficheirosParaZip');
      if (!input.files || input.files.length === 0) return showToast('Selecione arquivos para compactar.');
      
      const zip = new JSZip();
      for (let i = 0; i < input.files.length; i++) {
        zip.file(input.files[i].name, input.files[i]);
      }
      
      const blob = await zip.generateAsync({ type: 'blob' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'arquivos_compactados.zip';
      a.click();
      triggerHaptic('success');
      showToast('Download do arquivo ZIP iniciado!');
    }

    async function descompactarArquivo() {
      triggerHaptic('impact');
      const input = document.getElementById('ficheiroParaUnzip');
      const box = document.getElementById('resultadoUnzip');
      if (!input.files || input.files.length === 0) return showToast('Selecione um arquivo .zip primeiro.');

      try {
        const zip = await JSZip.loadAsync(input.files[0]);
        let nomes = '<ul style="text-align: left; margin: 8px 0 0 0; padding-left: 20px;">';
        zip.forEach((relativePath) => {
          nomes += `<li>📄 ${relativePath}</li>`;
        });
        nomes += '</ul>';
        box.innerHTML = `<strong>Conteúdo extraído:</strong>${nomes}`;
        box.style.display = 'block';
        triggerHaptic('success');
      } catch (err) {
        box.innerText = 'Não foi possível ler o arquivo como ZIP.';
        box.style.display = 'block';
        triggerHaptic('error');
      }
    }
  </script>
</body>
