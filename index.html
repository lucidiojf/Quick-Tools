<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Quick Tools</title>
  
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    :root {
      --bg: var(--tg-theme-bg-color, #ffffff);
      --text: var(--tg-theme-text-color, #111111);
      --sec-bg: var(--tg-theme-secondary-bg-color, #f3f4f6);
      --btn-bg: var(--tg-theme-button-color, #2481cc);
      --btn-text: var(--tg-theme-button-text-color, #ffffff);
      --hint: var(--tg-theme-hint-color, #707579);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 16px;
    }
    h1 { font-size: 20px; text-align: center; margin: 0 0 4px 0; }
    p.welcome { text-align: center; margin: 0 0 16px 0; font-size: 13px; color: var(--hint); }

    .tabs-wrapper {
      display: flex;
      overflow-x: auto;
      white-space: nowrap;
      margin-bottom: 16px;
      border-bottom: 2px solid var(--sec-bg);
      -webkit-overflow-scrolling: touch;
    }
    .tabs-wrapper::-webkit-scrollbar { display: none; }
    .tab-btn {
      background: none;
      border: none;
      padding: 10px 14px;
      color: var(--text);
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      opacity: 0.6;
      border-bottom: 3px solid transparent;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }
    .tab-btn.active {
      opacity: 1;
      border-bottom: 3px solid var(--btn-bg);
      color: var(--btn-bg);
    }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .card {
      background: var(--sec-bg);
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.04);
      margin-bottom: 14px;
    }
    label { font-weight: 600; font-size: 13px; display: block; margin-bottom: 6px; }
    input[type="text"], input[type="tel"], input[type="url"], input[type="file"], select, textarea {
      width: 100%;
      padding: 11px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 14px;
      margin-bottom: 12px;
      background: #ffffff;
      color: #000000;
    }
    textarea { min-height: 80px; resize: vertical; }

    button.action-btn {
      background-color: var(--btn-bg);
      color: var(--btn-text);
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      width: 100%;
      text-align: center;
    }
    button.action-btn:active { opacity: 0.85; }

    .grid-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .grid-buttons button {
      background: var(--btn-bg);
      color: var(--btn-text);
      border: none;
      padding: 11px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
    }

    .result-box {
      background: rgba(0, 0, 0, 0.04);
      border: 1px dashed #bbb;
      padding: 12px;
      border-radius: 8px;
      margin-top: 14px;
      word-break: break-all;
      text-align: center;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <h1>🛠️ Quick Tools</h1>
  <p class="welcome" id="boasVindas">Bem-vindo!</p>

  <!-- Abas de Navegação -->
  <div class="tabs-wrapper">
    <button type="button" class="tab-btn active" data-target="tab-whats">💬 WhatsApp</button>
    <button type="button" class="tab-btn" data-target="tab-busca">🔍 Buscas</button>
    <button type="button" class="tab-btn" data-target="tab-links">🔗 Links</button>
    <button type="button" class="tab-btn" data-target="tab-qr">🔳 QR Code</button>
    <button type="button" class="tab-btn" data-target="tab-transcribe">🎙️ Voz p/ Texto</button>
    <button type="button" class="tab-btn" data-target="tab-translate">🌐 Tradutor</button>
    <button type="button" class="tab-btn" data-target="tab-calc">🔢 Calculadora</button>
    <button type="button" class="tab-btn" data-target="tab-media">🎬 Vídeos</button>
  </div>

  <!-- 1. WHATSAPP DIRETO -->
  <div id="tab-whats" class="tab-content active">
    <div class="card">
      <label for="numWhats">Número com DDD (Brasil +55):</label>
      <input type="tel" id="numWhats" placeholder="Ex: 11999999999">
      <button type="button" class="action-btn" id="btnWhats">💬 Abrir Conversa Direta</button>
    </div>
  </div>

  <!-- 2. BUSCAS (8 PLATAFORMAS) -->
  <div id="tab-busca" class="tab-content">
    <div class="card">
      <label for="termoBusca">Digite o termo ou produto:</label>
      <input type="text" id="termoBusca" placeholder="Ex: fone sem fio">
      <div class="grid-buttons">
        <button type="button" class="btn-busca" data-dest="google">🌐 Google</button>
        <button type="button" class="btn-busca" data-dest="ml">🟡 Mercado Livre</button>
        <button type="button" class="btn-busca" data-dest="amazon">📦 Amazon</button>
        <button type="button" class="btn-busca" data-dest="shein">👗 Shein</button>
        <button type="button" class="btn-busca" data-dest="magalu">💙 Magalu</button>
        <button type="button" class="btn-busca" data-dest="ali">🔴 AliExpress</button>
        <button type="button" class="btn-busca" data-dest="bahia">🔵 Casas Bahia</button>
        <button type="button" class="btn-busca" data-dest="americanas">🔴 Americanas</button>
      </div>
    </div>
  </div>

  <!-- 3. ENCURTAR LINK -->
  <div id="tab-links" class="tab-content">
    <div class="card">
      <label for="linkOriginal">Cole a URL longa:</label>
      <input type="url" id="linkOriginal" placeholder="https://exemplo.com/pagina-longa">
      <button type="button" class="action-btn" id="btnEncurtar">⚡ Encurtar Link</button>
      <div id="boxLinkResult" class="result-box" style="display: none;">
        <span id="linkEncurtado"></span>
        <button type="button" class="action-btn" id="btnCopiarLink" style="margin-top: 10px; padding: 8px; background: #28a745;">📋 Copiar</button>
      </div>
    </div>
  </div>

  <!-- 4. QR CODE (GERAR E LER DA GALERIA) -->
  <div id="tab-qr" class="tab-content">
    <div class="card">
      <label for="textoQr">🎨 Criar QR Code:</label>
      <input type="text" id="textoQr" placeholder="Digite link, texto ou Pix...">
      <button type="button" class="action-btn" id="btnGerarQr">🔳 Gerar QR Code</button>
      <div id="boxQrResult" style="display: none; text-align: center; margin-top: 14px;">
        <img id="imgQr" src="" alt="QR Code" style="border: 4px solid white; border-radius: 8px; max-width: 180px;">
      </div>
    </div>

    <div class="card">
      <label for="qrFotoInput">🖼️ Ler QR Code da Galeria / Imagem:</label>
      <p style="font-size: 12px; color: var(--hint); margin: 0 0 10px 0;">Escolha uma captura de ecrã ou fotografia que contenha um QR Code:</p>
      <input type="file" id="qrFotoInput" accept="image/*">
      <button type="button" class="action-btn" id="btnLerQrFoto" style="background: #28a745;">🔍 Ler QR Code da Imagem</button>

      <div id="boxQrLido" class="result-box" style="display: none;">
        <strong>Conteúdo Identificado:</strong>
        <p id="textoQrLido" style="margin: 8px 0; font-size: 13px; font-weight: bold;"></p>
        <div style="display: flex; gap: 8px; margin-top: 10px;">
          <button type="button" class="action-btn" id="btnCopiarQrLido" style="padding: 8px; font-size: 13px;">📋 Copiar</button>
          <button type="button" class="action-btn" id="btnAbrirLinkQr" style="padding: 8px; font-size: 13px; display: none; background: #007bff;">🔗 Abrir Link</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 5. VOZ PARA TEXTO -->
  <div id="tab-transcribe" class="tab-content">
    <div class="card">
      <label>Reconhecimento de Fala:</label>
      <button type="button" id="btnGravarVoz" class="action-btn">🎙️ Iniciar Escuta</button>
      <p id="statusGravador" style="font-size: 12px; color: var(--hint); margin: 6px 0 10px 0; text-align: center;">Clique para falar via microfone.</p>
      
      <label for="textoTranscricao">Texto Transcrito:</label>
      <textarea id="textoTranscricao" placeholder="O que falar aparecerá aqui..."></textarea>
      <button type="button" class="action-btn" id="btnCopiarTranscricao" style="padding: 10px; font-size: 13px; background: #28a745;">📋 Copiar Texto</button>
    </div>
  </div>

  <!-- 6. TRADUTOR -->
  <div id="tab-translate" class="tab-content">
    <div class="card">
      <label for="textoTraduzir">Texto para traduzir:</label>
      <textarea id="textoTraduzir" placeholder="Digite o texto em qualquer idioma..."></textarea>
      <div style="display: flex; gap: 8px; margin-bottom: 12px;">
        <select id="langTarget" style="margin: 0;">
          <option value="pt">Português</option>
          <option value="en">Inglês</option>
          <option value="es">Espanhol</option>
          <option value="fr">Francês</option>
        </select>
        <button type="button" class="action-btn" id="btnTraduzir" style="width: auto; padding: 10px 16px;">Traduzir</button>
      </div>
      <div id="resTraducao" class="result-box" style="display: none; text-align: left;"></div>
    </div>
  </div>

  <!-- 7. CALCULADORA -->
  <div id="tab-calc" class="tab-content">
    <div class="card">
      <label for="expressaoCalc">Expressão matemática:</label>
      <input type="text" id="expressaoCalc" placeholder="Ex: 45 * 12 + 150 - 20">
      <button type="button" class="action-btn" id="btnCalcular">🧮 Calcular</button>
      <div id="resultadoCalc" class="result-box" style="display: none; font-weight: bold;"></div>
    </div>
  </div>

  <!-- 8. VÍDEOS -->
  <div id="tab-media" class="tab-content">
    <div class="card">
      <label>🗜️ Comprimir Vídeo:</label>
      <p style="font-size: 12px; color: var(--hint); margin: 0 0 10px 0;">Reduza o tamanho mantendo a qualidade:</p>
      <button type="button" class="action-btn btn-link-ext" data-url="https://www.compress2go.com/compress-video">🗜️ Acessar Compress2Go</button>
    </div>

    <div class="card">
      <label>📥 Descarregar Vídeos:</label>
      <p style="font-size: 12px; color: var(--hint); margin: 0 0 10px 0;">Selecione a plataforma:</p>
      <div class="grid-buttons">
        <button type="button" class="btn-link-ext" data-url="https://sssinstagram.com/en1">📸 Instagram</button>
        <button type="button" class="btn-link-ext" data-url="https://y2mate.net.co/3">▶️ YouTube</button>
      </div>
      <div style="margin-top: 10px;">
        <button type="button" class="action-btn btn-link-ext" style="background: #28a745;" data-url="https://www.savethevideo.com/pt/downloader">⚡ Universal (SaveTheVideo)</button>
      </div>
    </div>
  </div>

  <script>
    window.addEventListener("load", function() {
      var tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
      if (tg) {
        try {
          tg.ready();
          tg.expand();
          var user = tg.initDataUnsafe && tg.initDataUnsafe.user ? tg.initDataUnsafe.user : null;
          if (user && user.first_name) {
            document.getElementById('boasVindas').innerText = "Olá, " + user.first_name + "! Escolha uma ferramenta:";
          }
        } catch(e) {}
      }

      function haptic() {
        try {
          if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
        } catch(e) {}
      }

      function abrirLink(url) {
        haptic();
        try {
          if (tg && tg.openLink) {
            tg.openLink(url);
          } else {
            window.open(url, '_blank');
          }
        } catch(e) {
          window.open(url, '_blank');
        }
      }

      // NAVEGAÇÃO DE SEPARADORES
      var tabBtns = document.querySelectorAll('.tab-btn');
      var tabContents = document.querySelectorAll('.tab-content');

      for (var i = 0; i < tabBtns.length; i++) {
        tabBtns[i].onclick = function() {
          haptic();
          var targetId = this.getAttribute('data-target');

          for (var j = 0; j < tabBtns.length; j++) {
            tabBtns[j].className = tabBtns[j].className.replace(' active', '');
          }
          for (var k = 0; k < tabContents.length; k++) {
            tabContents[k].className = tabContents[k].className.replace(' active', '');
          }

          this.className += ' active';
          var targetEl = document.getElementById(targetId);
          if (targetEl) {
            targetEl.className += ' active';
          }
        };
      }

      // 1. WhatsApp
      var numWhats = document.getElementById('numWhats');
      numWhats.oninput = function() {
        this.value = this.value.replace(/\D/g, '').substring(0, 11);
      };
      document.getElementById('btnWhats').onclick = function() {
        var num = numWhats.value.trim();
        if (num.length < 10) return alert('Digite o número com o indicativo (DDD).');
        abrirLink('https://wa.me/55' + num);
      };

      // 2. Buscas (8 Lojas)
      var botoesBusca = document.querySelectorAll('.btn-busca');
      for (var b = 0; b < botoesBusca.length; b++) {
        botoesBusca[b].onclick = function() {
          var termoRaw = document.getElementById('termoBusca').value.trim();
          if (!termoRaw) return alert('Digite algo para pesquisar!');

          var termo = encodeURIComponent(termoRaw);
          var dest = this.getAttribute('data-dest');
          var url = 'https://www.google.com/search?q=' + termo;

          if (dest === 'ml') {
            url = 'https://lista.mercadolivre.com.br/' + termo;
          } else if (dest === 'amazon') {
            url = 'https://www.amazon.com.br/s?k=' + termo;
          } else if (dest === 'shein') {
            url = 'https://br.shein.com/pdsearch/' + termo;
          } else if (dest === 'magalu') {
            url = 'https://www.magazineluiza.com.br/busca/' + termo + '/';
          } else if (dest === 'ali') {
            url = 'https://pt.aliexpress.com/w/wholesale-' + termo + '.html';
          } else if (dest === 'bahia') {
            url = 'https://www.casasbahia.com.br/' + termo + '/b';
          } else if (dest === 'americanas') {
            url = 'https://www.americanas.com.br/busca/' + termo;
          }

          abrirLink(url);
        };
      }

      // 3. Encurtador
      document.getElementById('btnEncurtar').onclick = function() {
        haptic();
        var urlOrig = document.getElementById('linkOriginal').value.trim();
        if (!urlOrig) return alert('Insira a URL.');
        var box = document.getElementById('boxLinkResult');
        var label = document.getElementById('linkEncurtado');
        label.innerText = 'A encurtar...';
        box.style.display = 'block';

        fetch('https://is.gd/create.php?format=json&url=' + encodeURIComponent(urlOrig))
          .then(function(res) { return res.json(); })
          .then(function(data) {
            label.innerText = data.shorturl || 'Erro ao encurtar o endereço.';
          })
          .catch(function() {
            label.innerText = 'Erro ao contactar o serviço de links.';
          });
      };

      document.getElementById('btnCopiarLink').onclick = function() {
        haptic();
        var t = document.getElementById('linkEncurtado').innerText;
        navigator.clipboard.writeText(t).then(function() { alert('Ligação copiada!'); });
      };

      // 4. QR Code (Criação e Leitura de Imagem)
      document.getElementById('btnGerarQr').onclick = function() {
        haptic();
        var val = document.getElementById('textoQr').value.trim();
        if (!val) return alert('Preencha o campo.');
        document.getElementById('imgQr').src = 'https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=' + encodeURIComponent(val);
        document.getElementById('boxQrResult').style.display = 'block';
      };

      document.getElementById('btnLerQrFoto').onclick = function() {
        haptic();
        var inputFoto = document.getElementById('qrFotoInput');
        if (!inputFoto.files || inputFoto.files.length === 0) {
          return alert('Selecione primeiro uma imagem da sua galeria.');
        }

        var file = inputFoto.files[0];
        var boxLido = document.getElementById('boxQrLido');
        var textoLido = document.getElementById('textoQrLido');
        var btnAbrir = document.getElementById('btnAbrirLinkQr');

        textoLido.innerText = 'A processar a imagem...';
        btnAbrir.style.display = 'none';
        boxLido.style.display = 'block';

        var formData = new FormData();
        formData.append('file', file);

        fetch('https://api.qrserver.com/v1/read-qr-code/', {
          method: 'POST',
          body: formData
        })
        .then(function(res) { return res.json(); })
        .then(function(dados) {
          if (dados && dados[0] && dados[0].symbol && dados[0].symbol[0]) {
            var resultado = dados[0].symbol[0];
            if (resultado.data) {
              var valorDecodificado = resultado.data;
              textoLido.innerText = valorDecodificado;

              if (valorDecodificado.indexOf('http://') === 0 || valorDecodificado.indexOf('https://') === 0) {
                btnAbrir.style.display = 'block';
                btnAbrir.onclick = function() {
                  abrirLink(valorDecodificado);
                };
              }
            } else {
              textoLido.innerText = 'Nenhum código QR legível foi encontrado nesta imagem.';
            }
          } else {
            textoLido.innerText = 'Não foi possível ler o código QR.';
          }
        })
        .catch(function() {
          textoLido.innerText = 'Erro ao processar imagem. Experimente uma fotografia com melhor nitidez.';
        });
      };

      document.getElementById('btnCopiarQrLido').onclick = function() {
        haptic();
        var txt = document.getElementById('textoQrLido').innerText;
        if (!txt || txt.indexOf('Nenhum') === 0 || txt.indexOf('Erro') === 0) return alert('Nenhum dado válido para copiar.');
        navigator.clipboard.writeText(txt).then(function() { alert('Conteúdo copiado!'); });
      };

      // 5. Voz para Texto
      var recognition = null;
      var gravando = false;
      var textoConsolidado = '';
      var btnVoz = document.getElementById('btnGravarVoz');
      var statusVoz = document.getElementById('statusGravador');
      var campoTexto = document.getElementById('textoTranscricao');

      var SpeechClass = window.SpeechRecognition || window.webkitSpeechRecognition;

      if (SpeechClass) {
        recognition = new SpeechClass();
        recognition.continuous = true;
        recognition.interimResults = true;
        recognition.lang = 'pt-BR';

        recognition.onresult = function(event) {
          var textoInterino = '';
          for (var r = event.resultIndex; r < event.results.length; ++r) {
            var pedaco = event.results[r][0].transcript;
            if (event.results[r].isFinal) {
              textoConsolidado += (textoConsolidado ? ' ' : '') + pedaco.trim();
            } else {
              textoInterino += pedaco;
            }
          }
          campoTexto.value = (textoConsolidado + (textoInterino ? ' ' + textoInterino : '')).trim();
        };

        recognition.onerror = function(ev) {
          if (ev.error === 'not-allowed') {
            statusVoz.innerText = 'Permissão negada. Autorize o microfone.';
          } else {
            statusVoz.innerText = 'Erro: ' + ev.error;
          }
        };

        recognition.onend = function() {
          if (gravando) {
            try { recognition.start(); } catch(e) {}
          } else {
            btnVoz.innerText = '🎙️ Iniciar Escuta';
            btnVoz.style.background = 'var(--btn-bg)';
            statusVoz.innerText = 'Gravação encerrada.';
          }
        };
      }

      btnVoz.onclick = function() {
        haptic();
        if (!SpeechClass) return alert('Navegador sem suporte à API Web Speech.');

        if (!gravando) {
          textoConsolidado = campoTexto.value.trim();
          try {
            recognition.start();
            gravando = true;
            btnVoz.innerText = '⏹️ Parar Escuta';
            btnVoz.style.background = '#d9534f';
            statusVoz.innerText = 'A ouvir... Fale agora.';
          } catch(err) {
            statusVoz.innerText = 'Falha ao iniciar.';
          }
        } else {
          gravando = false;
          try { recognition.stop(); } catch(e) {}
        }
      };

      document.getElementById('btnCopiarTranscricao').onclick = function() {
        haptic();
        var txt = campoTexto.value;
        if (!txt) return alert('Nenhum texto para copiar.');
        navigator.clipboard.writeText(txt).then(function() { alert('Texto copiado com sucesso!'); });
      };

      // 6. Tradutor
      document.getElementById('btnTraduzir').onclick = function() {
        haptic();
        var texto = document.getElementById('textoTraduzir').value.trim();
        var lang = document.getElementById('langTarget').value;
        var box = document.getElementById('resTraducao');
        if (!texto) return alert('Digite o texto a traduzir.');
        box.innerText = 'A traduzir...';
        box.style.display = 'block';

        fetch('https://api.mymemory.translated.net/get?q=' + encodeURIComponent(texto) + '&langpair=autodetect|' + lang)
          .then(function(res) { return res.json(); })
          .then(function(data) {
            box.innerText = (data.responseData && data.responseData.translatedText) ? data.responseData.translatedText : 'Falha na tradução.';
          })
          .catch(function() {
            box.innerText = 'Erro ao contactar o serviço de tradução.';
          });
      };

      // 7. Calculadora
      document.getElementById('btnCalcular').onclick = function() {
        haptic();
        var exp = document.getElementById('expressaoCalc').value.trim();
        var box = document.getElementById('resultadoCalc');
        if (!exp) return alert('Digite o cálculo.');
        
        var expLimpa = exp.replace(/[^0-9+\-*/().]/g, '');
        if (!expLimpa) {
          box.innerText = 'Expressão inválida.';
          box.style.display = 'block';
          return;
        }

        try {
          var res = (new Function('return (' + expLimpa + ')'))();
          box.innerText = 'Resultado: ' + res;
          box.style.display = 'block';
        } catch(e) {
          box.innerText = 'Expressão matemática inválida.';
          box.style.display = 'block';
        }
      };

      // 8. Links Externos (Vídeo)
      var linksExt = document.querySelectorAll('.btn-link-ext');
      for (var l = 0; l < linksExt.length; l++) {
        linksExt[l].onclick = function() {
          abrirLink(this.getAttribute('data-url'));
        };
      }

    });
  </script>
</body>
</html>
